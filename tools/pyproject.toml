[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name            = "grs"
version         = "0.3.0"
description     = "CLI tool per file GRS — Game Rule Script v0.3"
requires-python = ">=3.9"

[project.scripts]
grs = "grs.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["grs*"]
