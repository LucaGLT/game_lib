meta:
  game_id: tictactoe
  namespace: tris.core
  schema_version: 1.0.0
  compatibility:
    gmRules_min: 0.5.0

targets:
  - id: T_PlayerX
    kind: ACTOR
    selector: SELECTED_ACTOR
    range_type: NONE
    required: true
    allow_self: true
  - id: T_PlayerO
    kind: ACTOR
    selector: SELECTED_ACTOR
    range_type: NONE
    required: true
    allow_self: true
  - id: T_ActorSelf
    kind: ACTOR
    selector: SELF
    range_type: NONE
    required: true
    allow_self: true
  - id: T_Cell
    kind: LOCATION
    selector: SELECTED
    range_type: NONE
    required: true
    allow_self: true

conditions:
  - id: C_PlayerXExists
    type: ACTOR_EXISTS
    subject_id_ref: input.player_x_id
  - id: C_PlayerOExists
    type: ACTOR_EXISTS
    subject_id_ref: input.player_o_id
  - id: C_CellExists
    type: LOCATION_EXISTS
    location_ref: input.cell_id
  - id: C_GameNotOver
    op: NOT
    children:
      - type: ACTOR_HAS_TAG
        subject_id_ref: input.system_actor_id
        tag: game_over
  - id: C_XTurn
    type: ACTOR_HAS_STATUS
    subject_id_ref: input.player_x_id
    status_id: ACTIVE_TURN
  - id: C_OTurn
    type: ACTOR_HAS_STATUS
    subject_id_ref: input.player_o_id
    status_id: ACTIVE_TURN
  - id: C_CanMoveX
    op: ALL_OF
    children:
      - ref: C_PlayerXExists
      - ref: C_CellExists
      - ref: C_GameNotOver
      - ref: C_XTurn
  - id: C_CanMoveO
    op: ALL_OF
    children:
      - ref: C_PlayerOExists
      - ref: C_CellExists
      - ref: C_GameNotOver
      - ref: C_OTurn
  - id: C_EventWinnerX
    type: ACTOR_EXISTS
    subject_id_ref: event.player_x_id
  - id: C_EventWinnerO
    type: ACTOR_EXISTS
    subject_id_ref: event.player_o_id
  - id: C_EventDrawCompleted
    type: ALWAYS

effects:
  - id: E_ApplyMoveX
    type: MANUAL_EFFECT
    event_name: tris.move.apply_x
    optional: false
    stop_on_failure: true
  - id: E_ApplyMoveO
    type: MANUAL_EFFECT
    event_name: tris.move.apply_o
    optional: false
    stop_on_failure: true
  - id: E_CheckOutcome
    type: MANUAL_EFFECT
    event_name: tris.outcome.check
    optional: true
    stop_on_failure: false
  - id: E_SwitchTurnToX
    type: MANUAL_EFFECT
    event_name: tris.turn.to_x
    optional: true
    stop_on_failure: false
  - id: E_SwitchTurnToO
    type: MANUAL_EFFECT
    event_name: tris.turn.to_o
    optional: true
    stop_on_failure: false
  - id: E_RejectInvalidMove
    type: MANUAL_EFFECT
    event_name: tris.invalid_move
    optional: true
    stop_on_failure: false
  - id: E_SetWinnerX
    type: APPLY_STATUS
    target: T_PlayerX
    status_id: WINNER
    optional: false
    stop_on_failure: true
  - id: E_SetWinnerO
    type: APPLY_STATUS
    target: T_PlayerO
    status_id: WINNER
    optional: false
    stop_on_failure: true
  - id: E_SetDrawX
    type: APPLY_STATUS
    target: T_PlayerX
    status_id: DRAW
    optional: false
    stop_on_failure: true
  - id: E_SetDrawO
    type: APPLY_STATUS
    target: T_PlayerO
    status_id: DRAW
    optional: false
    stop_on_failure: true
  - id: E_MarkGameOver
    type: ADD_TAG
    target: T_ActorSelf
    tag: game_over
    optional: false
    stop_on_failure: true
  - id: E_LogMove
    type: MANUAL_EFFECT
    event_name: tris.log.move
    optional: true
    stop_on_failure: false
  - id: E_LogWinnerX
    type: MANUAL_EFFECT
    event_name: tris.log.winner_x
    optional: true
    stop_on_failure: false
  - id: E_LogWinnerO
    type: MANUAL_EFFECT
    event_name: tris.log.winner_o
    optional: true
    stop_on_failure: false
  - id: E_LogDraw
    type: MANUAL_EFFECT
    event_name: tris.log.draw
    optional: true
    stop_on_failure: false

statuses:
  - id: ACTIVE_TURN
    stacking_policy:
      mode: ONE_ONLY
    default_duration:
      type: UNTIL_REMOVED
    on_apply:
      - type: ADD_TAG
        target: T_ActorSelf
        tag: active_turn
        optional: false
        stop_on_failure: true
    on_remove:
      - type: REMOVE_TAG
        target: T_ActorSelf
        tag: active_turn
        optional: false
        stop_on_failure: true
  - id: WINNER
    stacking_policy:
      mode: ONE_ONLY
    default_duration:
      type: UNTIL_REMOVED
    on_apply:
      - type: ADD_TAG
        target: T_ActorSelf
        tag: winner
        optional: false
        stop_on_failure: true
  - id: DRAW
    stacking_policy:
      mode: ONE_ONLY
    default_duration:
      type: UNTIL_REMOVED
    on_apply:
      - type: ADD_TAG
        target: T_ActorSelf
        tag: draw
        optional: false
        stop_on_failure: true

rules:
  - id: Move_X
    priority: 100
    enabled: true
    target: T_PlayerX
    conditions:
      ref: C_CanMoveX
    effects:
      - ref: E_ApplyMoveX
      - ref: E_CheckOutcome
        optional: true
      - ref: E_SwitchTurnToO
        optional: true
      - ref: E_LogMove
        optional: true
  - id: Move_O
    priority: 100
    enabled: true
    target: T_PlayerO
    conditions:
      ref: C_CanMoveO
    effects:
      - ref: E_ApplyMoveO
      - ref: E_CheckOutcome
        optional: true
      - ref: E_SwitchTurnToX
        optional: true
      - ref: E_LogMove
        optional: true
  - id: Reject_Move_When_GameOver
    priority: 10
    enabled: true
    target: T_PlayerX
    conditions:
      op: NOT
      children:
        - ref: C_GameNotOver
    effects:
      - ref: E_RejectInvalidMove
        optional: true

triggers:
  - id: T_GameStarted
    priority: 1
    enabled: true
    type: ON_GAME_STARTED
    effects:
      - ref: E_SwitchTurnToX
        optional: true
  - id: T_WinnerX
    priority: 20
    enabled: true
    type: ON_TRIS_WIN_X
    conditions:
      ref: C_EventWinnerX
    effects:
      - ref: E_SetWinnerX
      - ref: E_MarkGameOver
      - ref: E_LogWinnerX
        optional: true
  - id: T_WinnerO
    priority: 20
    enabled: true
    type: ON_TRIS_WIN_O
    conditions:
      ref: C_EventWinnerO
    effects:
      - ref: E_SetWinnerO
      - ref: E_MarkGameOver
      - ref: E_LogWinnerO
        optional: true
  - id: T_Draw
    priority: 30
    enabled: true
    type: ON_TRIS_DRAW
    conditions:
      ref: C_EventDrawCompleted
    effects:
      - ref: E_SetDrawX
      - ref: E_SetDrawO
      - ref: E_MarkGameOver
      - ref: E_LogDraw
        optional: true
